name: DevSRE-Companion CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    name: Testes Unitários e Evals de RAG

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências e Pacote CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Executar Evals Automatizados do RAG via CLI
        run: |
          devsre eval

      - name: Executar Testes Unitários do Framework
        run: |
          pytest -v
