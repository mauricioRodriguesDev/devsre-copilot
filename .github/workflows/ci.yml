name: DevSRE-Companion CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    name: Testes Unitários e Evals de RAG

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Evals Automatizados do RAG
        run: |
          python main.py eval

      - name: Executar Testes Unitários do Framework
        run: |
          pytest tests/test_tools.py tests/test_auth.py::test_valid_token_authentication -v
